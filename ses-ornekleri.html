<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Motor Sesleri</title>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; min-height: 100vh; background: linear-gradient(#2f7fe0, #9fd4ff); font-family: Nunito, sans-serif; display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
    .kart { width: min(520px, 100%); background: #fffaf0; border: 4px solid #1a3a8a; border-radius: 18px; padding: 18px; display: grid; gap: 10px; box-shadow: 0 10px 30px #0006; }
    h1 { margin: 0; font-family: 'Lilita One', sans-serif; font-weight: 400; color: #e8413a; text-align: center; }
    p { margin: 0; text-align: center; color: #1a2a5a; }
    .satir { display: flex; align-items: center; gap: 8px; background: #fff; border: 2px solid #c8d4f0; border-radius: 12px; padding: 8px 10px; }
    .satir.secili { border-color: #2aa860; background: #eaffef; }
    .satir b { flex: 1; color: #1a2a5a; }
    button { font: inherit; font-weight: 900; border: 0; border-radius: 10px; padding: 9px 12px; cursor: pointer; background: #e4ecff; color: #1a2a5a; box-shadow: 0 3px 0 #7a8ac0; }
    button.dinle { background: linear-gradient(#ffcf3a, #f09a10); color: #3a1a00; box-shadow: 0 3px 0 #a05a00; }
    button:active { transform: translateY(2px); box-shadow: none; }
    #durum { min-height: 1.3em; font-weight: 900; color: #1a4aa8; }
    .cubuk { height: 10px; background: #0001; border-radius: 6px; overflow: hidden; } .cubuk div { height: 100%; width: 0; background: linear-gradient(90deg, #3ae86a, #ffcf3a, #e8413a); }
  </style>
</head>
<body>
  <div class="kart">
    <h1>🔊 Motor Sesleri</h1>
    <p>Her birini dinle: önce rölanti, sonra yerinde gaz, sonra vites atarak hızlanma, en son gazdan çekme. Beğendiğine <b>Seç</b> de; oyunda o ses çalar.</p>
    <div id="liste"></div>
    <div class="cubuk"><div id="cubuk"></div></div>
    <p id="durum"></p>
  </div>
  <script src="ses.js"></script>
  <script>
    const liste = document.getElementById('liste');
    let calan = null;
    function ciz() {
      liste.innerHTML = Object.entries(Ses.MOTORLAR).map(([k, P]) => `<div class="satir ${Ses.motorTipi === k ? 'secili' : ''}"><b>${P.ad}</b><button class="dinle" data-d="${k}">▶ Dinle</button><button data-s="${k}">${Ses.motorTipi === k ? '✅ Seçili' : 'Seç'}</button></div>`).join('');
      liste.querySelectorAll('[data-d]').forEach(b => b.onclick = () => dinle(b.dataset.d));
      liste.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { Ses.motorTipiSec(b.dataset.s); ciz(); document.getElementById('durum').textContent = '✅ ' + Ses.MOTORLAR[b.dataset.s].ad + ' seçildi. Oyunda bu ses çalacak.'; });
    }
    // 9 saniyelik deneme sürüşü
    function dinle(tip) {
      Ses.baslat();
      if (!Ses.acik) Ses.degistir();   // oyunun sesi kapalı kaldıysa aç
      if (calan) { clearInterval(calan); Ses.motorDurdur(); }
      setTimeout(() => {
        Ses.motorBaslat(tip);
        const bas = performance.now();
        document.getElementById('durum').textContent = '🎧 ' + Ses.MOTORLAR[tip].ad;
        calan = setInterval(() => {
          const t = (performance.now() - bas) / 1000;
          let hiz = 0, gaz = 0;
          if (t < 1.2) { hiz = 0; gaz = 0; }                       // rölanti
          else if (t < 2.0) { hiz = 0; gaz = 1; }                  // yerinde gaz
          else if (t < 2.6) { hiz = 0; gaz = 0; }
          else if (t < 7.2) { hiz = Math.min(16, (t - 2.6) * 3.6); gaz = 1; }   // hızlanma
          else if (t < 9) { hiz = Math.max(0, 16 - (t - 7.2) * 6); gaz = 0; }    // gazdan çek
          else { clearInterval(calan); calan = null; Ses.motorDurdur(); document.getElementById('cubuk').style.width = '0'; return; }
          Ses.motorAyarla(hiz, gaz, false);
          document.getElementById('cubuk').style.width = Math.min(100, t / 9 * 100) + '%';
        }, 50);
      }, 120);
    }
    ciz();
  </script>
</body>
</html>
